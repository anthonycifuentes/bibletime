name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only ever reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Must run before setup-node, so that `cache: pnpm` can find the store.
      # No `version:` here on purpose — the action reads the root package.json
      # `packageManager` field, so CI and local installs can never drift.
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      # No --ignore-scripts: the packages listed under `allowBuilds` in
      # pnpm-workspace.yaml (esbuild, lightningcss, unrs-resolver) need their
      # postinstall to produce native binaries, and the build fails without them.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
